<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GovMap</title>
<!--
  The app's GovMap work map (see CLAUDE.md "GovMap overlays"). GovMap's API is JavaScript only and
  its token is bound to the domain the page is served from, so the app loads this page in a WebView
  from that domain rather than synthesising it locally. It holds no token: the app passes one to
  skor.init(). Events go back through window.SkorBridge (a @JavascriptInterface).

  Browser testing: govmap.html#token=…  self-initialises at the default centre.
-->
<style>
  html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #1d1d1b; }
</style>
</head>
<body>
<div id="map"></div>
<script>
(function () {
  "use strict";

  var bridge = window.SkorBridge || {
    onLoad: function () { console.log("onLoad"); },
    onClick: function (x, y) { console.log("onClick", x, y); },
    onExtent: function (a, b, c, d, level, res) { console.log("onExtent", a, b, c, d, level, res); },
    onError: function (msg) { console.log("onError", msg); }
  };

  function fail(e) {
    var msg = (e && (e.message || e.error || JSON.stringify(e))) || String(e);
    bridge.onError(String(msg));
  }

  // displayGeometries ids per group, so each show() replaces only that group's geometries.
  var shown = {};

  // GovMap's API answers over postMessage and does not keep overlapping calls apart: two
  // displayGeometries in flight both resolve with the second one's ids. The app pushes points,
  // shapes and the user dot in the same instant, so ids got filed under the wrong group and the
  // next user-dot refresh cleared the project's points and boundary. One call at a time.
  var queue = Promise.resolve();
  var CALL_TIMEOUT_MS = 10000;

  function enqueue(task) {
    var run = queue.then(function () {
      // A call GovMap never answers must not stall every later one behind it.
      return Promise.race([
        Promise.resolve().then(task),
        new Promise(function (resolve) {
          setTimeout(function () { console.log("govmap call timed out"); resolve(); }, CALL_TIMEOUT_MS);
        })
      ]);
    });
    queue = run.catch(function () {});
    return run;
  }

  function clearNow(group) {
    var ids = shown[group];
    delete shown[group];
    if (ids && ids.length) {
      try { govmap.clearGeometriesById(ids); } catch (e) { fail(e); }
    }
  }

  function clear(group) {
    enqueue(function () { clearNow(group); });
  }

  function show(group, data) {
    var type = govmap.geometryType[data.geometryType];
    if (type === undefined) { fail("geometryType " + data.geometryType); return; }
    data.geometryType = type;
    data.clearExisting = false;
    data.showBubble = false;
    enqueue(function () {
      // GovMap returns its own thenable, which honours a single then(); wrap it rather than chain.
      return new Promise(function (resolve) {
        govmap.displayGeometries(data).then(function (r) {
          clearNow(group);
          shown[group] = r && r.data;
          resolve();
        }, function (e) {
          fail(e);
          resolve();
        });
      });
    });
  }

  window.skor = {
    init: function (token, x, y, level, background) {
      govmap.createMap("map", {
        token: token,
        center: { x: x, y: y },
        level: level,
        background: String(background),
        bgButton: false,
        zoomButtons: false,
        showXY: false,
        identifyOnClick: false,
        layersMode: 4,
        layers: [],
        visibleLayers: [],
        onError: fail,
        onLoad: function () {
          govmap.onEvent(govmap.events.CLICK).progress(function (e) {
            bridge.onClick(e.mapPoint.x, e.mapPoint.y);
          });
          govmap.onEvent(govmap.events.EXTENT_CHANGE).progress(function (e) {
            var x = e.extent, l = e.lod || {};
            bridge.onExtent(x.xmin, x.ymin, x.xmax, x.ymax, l.level == null ? -1 : l.level,
              l.resolution == null ? -1 : l.resolution);
          });
          bridge.onLoad();
        }
      });
    },
    show: show,
    clear: clear,
    zoomTo: function (x, y, level) { govmap.zoomToXY({ x: x, y: y, level: level, marker: false }); },
    setBackground: function (id) { govmap.setBackground(id); },
    setLayers: function (on, off) { govmap.setVisibleLayers(on, off); }
  };

  window.addEventListener("error", function (e) { fail(e.message); });

  var script = document.createElement("script");
  script.src = "https://www.govmap.gov.il/govmap/api/govmap.api.js";
  script.onerror = function () { bridge.onError("script"); };
  script.onload = function () {
    var m = /token=([^&]+)/.exec(location.hash);
    if (m) window.skor.init(decodeURIComponent(m[1]), 179507, 663838, 8, 1);
    else if (window.SkorBridge && window.SkorBridge.onReady) window.SkorBridge.onReady();
  };
  document.head.appendChild(script);
})();
</script>
</body>
</html>
